<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片大小调整工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* 动态背景粒子效果 */
        .bg-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 10px;
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float linear infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) rotate(720deg);
                opacity: 0;
            }
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            width: 100%;
            max-width: 500px;
            z-index: 1;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }

        /* 错误和成功提示 */
        .flash-messages {
            margin-bottom: 20px;
        }

        .flash {
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            font-size: 14px;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .flash.error {
            background: #fff0f0;
            color: #e74c3c;
            border: 1px solid #fecaca;
        }

        .flash.success {
            background: #f0fff4;
            color: #27ae60;
            border: 1px solid #a7f3d0;
        }

        /* 上传区域 */
        .upload-area {
            border: 2px dashed #ccc;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .upload-area:hover {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.05);
        }

        .upload-area.dragover {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.1);
        }

        .upload-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .upload-text {
            color: #666;
            font-size: 14px;
        }

        #file {
            display: none;
        }

        .file-info {
            margin-top: 10px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 13px;
            color: #333;
        }

        /* 尺寸设置 */
        .dimension-section {
            margin-bottom: 20px;
        }

        .dimension-row {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
            text-align: center;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        .dimension-separator {
            font-size: 20px;
            color: #666;
            font-weight: bold;
        }

        /* 保持宽高比复选框 */
        .aspect-ratio-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            gap: 8px;
        }

        .aspect-ratio-container input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .aspect-ratio-container label {
            margin: 0;
            cursor: pointer;
            font-size: 14px;
        }

        .link-icon {
            cursor: pointer;
            font-size: 18px;
            transition: color 0.3s;
        }

        .link-icon.linked {
            color: #667eea;
        }

        .link-icon.unlinked {
            color: #ccc;
        }

        /* 图片预览 */
        .preview-container {
            margin-bottom: 20px;
            display: none;
        }

        .preview-container img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .preview-info {
            margin-top: 8px;
            font-size: 12px;
            color: #666;
        }

        /* 按钮 */
        button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* 下载区域 */
        .download-section {
            margin-top: 20px;
            padding: 20px;
            background: #f0fff4;
            border-radius: 10px;
            border: 1px solid #a7f3d0;
            display: none;
        }

        .download-section a {
            display: inline-block;
            padding: 12px 25px;
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            transition: transform 0.2s;
        }

        .download-section a:hover {
            transform: translateY(-2px);
        }

        /* 页脚 */
        footer {
            margin-top: 25px;
            font-size: 12px;
            color: #999;
        }

        /* 加载动画 */
        .loading {
            display: none;
            margin: 15px auto;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 响应式设计 */
        @media (max-width: 480px) {
            .container {
                padding: 25px;
            }
            
            h1 {
                font-size: 22px;
            }
            
            .dimension-row {
                flex-direction: column;
                gap: 8px;
            }
        }
    </style>
</head>
<body>
    <!-- 动态背景粒子 -->
    <div class="bg-particles" id="particles"></div>
    
    <div class="container">
        <h1>图片大小调整工具</h1>
        <p class="subtitle">上传、调整、下载，简单快捷</p>
        
        <!-- Flash 消息显示 -->
        <div class="flash-messages">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="flash {{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
        </div>
        
        <form action="/" method="post" enctype="multipart/form-data" id="resizeForm">
            <!-- 上传区域 -->
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📁</div>
                <div class="upload-text" id="uploadText">点击或拖拽图片到此处</div>
                <input type="file" id="file" name="file" accept=".png,.jpg,.jpeg,.gif,.bmp,.webp,.tiff" required>
                <div class="file-info" id="fileInfo" style="display:none;"></div>
            </div>
            
            <!-- 图片预览 -->
            <div class="preview-container" id="previewContainer">
                <img id="previewImage" src="" alt="预览">
                <div class="preview-info" id="previewInfo"></div>
            </div>
            
            <!-- 尺寸设置 -->
            <div class="dimension-section">
                <div class="dimension-row">
                    <div style="flex:1;">
                        <label for="width">宽度 (px)</label>
                        <input type="number" id="width" name="width" min="1" max="100000" placeholder="宽度" required>
                    </div>
                    <span class="dimension-separator">×</span>
                    <div style="flex:1;">
                        <label for="height">高度 (px)</label>
                        <input type="number" id="height" name="height" min="1" max="100000" placeholder="高度" required>
                    </div>
                </div>
                
                <!-- 保持宽高比 -->
                <div class="aspect-ratio-container">
                    <input type="checkbox" id="maintain_aspect" name="maintain_aspect" checked>
                    <label for="maintain_aspect">保持宽高比</label>
                    <span class="link-icon linked" id="linkIcon" title="锁定/解锁宽高比">🔗</span>
                </div>
            </div>
            
            <!-- 加载动画 -->
            <div class="loading" id="loading">
                <div class="spinner"></div>
            </div>
            
            <!-- 提交按钮 -->
            <button type="submit" id="submitBtn">调整大小</button>
        </form>
        
        <!-- 下载区域 -->
        <div class="download-section" id="downloadSection">
            <p style="margin-bottom:10px;color:#27ae60;font-weight:500;">✅ 图片调整成功！</p>
            <a href="{{ url_for('serve_file', filename=download_filename if download_filename else '') }}" download>点击下载图片</a>
        </div>
        
        <footer>© 2026 魅影m1y1</footer>
    </div>

    <script>
        // 创建背景粒子
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.width = particle.style.height = (Math.random() * 20 + 5) + 'px';
                particle.style.animationDuration = (Math.random() * 20 + 10) + 's';
                particle.style.animationDelay = (Math.random() * 10) + 's';
                container.appendChild(particle);
            }
        }
        createParticles();

        // 获取DOM元素
        const fileInput = document.getElementById('file');
        const uploadArea = document.getElementById('uploadArea');
        const uploadText = document.getElementById('uploadText');
        const fileInfo = document.getElementById('fileInfo');
        const widthInput = document.getElementById('width');
        const heightInput = document.getElementById('height');
        const maintainAspectCheckbox = document.getElementById('maintain_aspect');
        const linkIcon = document.getElementById('linkIcon');
        const previewContainer = document.getElementById('previewContainer');
        const previewImage = document.getElementById('previewImage');
        const previewInfo = document.getElementById('previewInfo');
        const loading = document.getElementById('loading');
        const submitBtn = document.getElementById('submitBtn');
        const downloadSection = document.getElementById('downloadSection');
        const form = document.getElementById('resizeForm');

        let originalImageInfo = null;
        let aspectRatioLocked = true;
        let currentFile = null;

        // 点击上传区域触发文件选择
        uploadArea.addEventListener('click', () => fileInput.click());

        // 拖拽上传
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                fileInput.files = e.dataTransfer.files;
                handleFileSelect(e.dataTransfer.files[0]);
            }
        });

        // 文件选择处理
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) {
                handleFileSelect(e.target.files[0]);
            }
        });

        function handleFileSelect(file) {
            currentFile = file;
            const maxSize = 16 * 1024 * 1024; // 16MB
            
            if (file.size > maxSize) {
                alert('文件大小超过限制（最大16MB）');
                return;
            }
            
            // 显示文件信息
            fileInfo.style.display = 'block';
            fileInfo.textContent = `📄 ${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
            uploadText.textContent = '点击更换图片';
            
            // 获取图片信息
            loadImageInfo(file);
        }

        function loadImageInfo(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    originalImageInfo = { width: img.width, height: img.height };
                    widthInput.value = img.width;
                    heightInput.value = img.height;
                    
                    // 显示预览
                    previewImage.src = e.target.result;
                    previewContainer.style.display = 'block';
                    previewInfo.textContent = `${img.width} × ${img.height} px`;
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // 保持宽高比功能
        linkIcon.addEventListener('click', () => {
            aspectRatioLocked = !aspectRatioLocked;
            maintainAspectCheckbox.checked = aspectRatioLocked;
            
            if (aspectRatioLocked) {
                linkIcon.textContent = '🔗';
                linkIcon.classList.remove('unlinked');
                linkIcon.classList.add('linked');
            } else {
                linkIcon.textContent = '🔓';
                linkIcon.classList.remove('linked');
                linkIcon.classList.add('unlinked');
            }
        });

        // 宽度输入时保持宽高比
        widthInput.addEventListener('input', () => {
            if (aspectRatioLocked && originalImageInfo && originalImageInfo.width > 0) {
                const ratio = originalImageInfo.height / originalImageInfo.width;
                heightInput.value = Math.round(widthInput.value * ratio);
            }
        });

        // 高度输入时保持宽高比
        heightInput.addEventListener('input', () => {
            if (aspectRatioLocked && originalImageInfo && originalImageInfo.width > 0) {
                const ratio = originalImageInfo.width / originalImageInfo.height;
                widthInput.value = Math.round(heightInput.value * ratio);
            }
        });

        // 表单提交处理
        form.addEventListener('submit', (e) => {
            if (!fileInput.files.length) {
                e.preventDefault();
                alert('请先选择图片文件');
                return false;
            }
            loading.style.display = 'block';
            submitBtn.disabled = true;
            submitBtn.textContent = '处理中...';
        });

        // 页面加载时检查是否有下载文件名
        {% if download_filename %}
        downloadSection.style.display = 'block';
        {% endif %}
    </script>
</body>
</html>
